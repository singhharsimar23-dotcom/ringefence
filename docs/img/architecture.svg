<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-labelledby="t d">
  <title id="t">Ringfence architecture: how one payroll run flows from documents to a verified payment</title>
  <desc id="d">Top row, propose: untrusted documents go to the agent, which can only propose. The propose gate checks every input in code, the run is priced in Decimal with FX on the employer's own account, and a person signs the exact batch. Bottom row, release: the release gate re-reads bank details, the executor saves its intent and sends with the employer's own token to Airwallex, the poller follows each payout to PAID or RETURNED, and a verifier with no model signs a certificate. An append-only hash-chained ledger records every step.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111; }
    .h { font-size: 14px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #555; }
    .lane { font-size: 11px; letter-spacing: .08em; fill: #777; font-weight: 600; }
    .box { fill: #fff; stroke: #111; stroke-width: 1.5; }
    .code .box { fill: #111; }
    .code text { fill: #fff; }
    .code .s { fill: #c9c9c9; }
    .arrow { stroke: #111; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; animation: flow 1.2s linear infinite; }
    .led { fill: #f2f2f2; stroke: #111; stroke-width: 1.5; stroke-dasharray: 2 4; }
    .tick { stroke: #999; stroke-width: 1; stroke-dasharray: 2 3; }
    .pkt { fill: #111; stroke: #fff; stroke-width: 2; }
    .pulse { animation: pulse 13s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -10; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .arrow, .pulse { animation: none; } .pkt { display: none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fafafa"/>

  <text class="lane" x="20" y="38">1  PROPOSE  (nothing here can move money)</text>
  <text class="lane" x="20" y="258">2  RELEASE  (one person's signature, then code)</text>

  <!-- row 1 -->
  <g>
    <rect class="box" x="20" y="56" width="160" height="84" rx="6"/>
    <text class="h" x="100" y="90" text-anchor="middle">Timesheets, emails</text>
    <text class="s" x="100" y="110" text-anchor="middle">untrusted input,</text>
    <text class="s" x="100" y="125" text-anchor="middle">even the suspicious one</text>
  </g>
  <g>
    <rect class="box" x="205" y="56" width="160" height="84" rx="6"/>
    <text class="h" x="285" y="90" text-anchor="middle">Agent (Claude)</text>
    <text class="s" x="285" y="110" text-anchor="middle">10 tools, read or</text>
    <text class="s" x="285" y="125" text-anchor="middle">propose only</text>
  </g>
  <g class="code">
    <rect class="box" x="390" y="56" width="160" height="84" rx="6"/>
    <text class="h" x="470" y="90" text-anchor="middle">Propose gate</text>
    <text class="s" x="470" y="110" text-anchor="middle">code validates every</text>
    <text class="s" x="470" y="125" text-anchor="middle">input, model never trusted</text>
  </g>
  <g class="code">
    <rect class="box" x="575" y="56" width="160" height="84" rx="6"/>
    <text class="h" x="655" y="90" text-anchor="middle">Price the run</text>
    <text class="s" x="655" y="110" text-anchor="middle">Decimal money, FX on the</text>
    <text class="s" x="655" y="125" text-anchor="middle">employer's own account</text>
  </g>
  <g>
    <rect class="box" x="760" y="56" width="160" height="84" rx="6"/>
    <text class="h" x="840" y="90" text-anchor="middle">A person signs</text>
    <text class="s" x="840" y="110" text-anchor="middle">the exact batch: payees,</text>
    <text class="s" x="840" y="125" text-anchor="middle">amounts, bank details</text>
  </g>
  <path class="arrow" d="M180,98 H203" marker-end="url(#a)"/>
  <path class="arrow" d="M365,98 H388" marker-end="url(#a)"/>
  <path class="arrow" d="M550,98 H573" marker-end="url(#a)"/>
  <path class="arrow" d="M735,98 H758" marker-end="url(#a)"/>
  <path class="arrow" d="M840,140 V276" marker-end="url(#a)"/>

  <!-- row 2 (right to left) -->
  <g class="code">
    <rect class="box" x="760" y="276" width="160" height="84" rx="6"/>
    <text class="h" x="840" y="310" text-anchor="middle">Release gate</text>
    <text class="s" x="840" y="330" text-anchor="middle">re-reads bank details,</text>
    <text class="s" x="840" y="345" text-anchor="middle">25 refusal codes</text>
  </g>
  <g class="code">
    <rect class="box" x="575" y="276" width="160" height="84" rx="6"/>
    <text class="h" x="655" y="310" text-anchor="middle">Executor</text>
    <text class="s" x="655" y="330" text-anchor="middle">intent saved first, one</text>
    <text class="s" x="655" y="345" text-anchor="middle">request ID per payment</text>
  </g>
  <g>
    <rect class="box" x="390" y="276" width="160" height="84" rx="6"/>
    <text class="h" x="470" y="310" text-anchor="middle">Airwallex</text>
    <text class="s" x="470" y="330" text-anchor="middle">employer's own account,</text>
    <text class="s" x="470" y="345" text-anchor="middle">that employer's own token</text>
  </g>
  <g class="code">
    <rect class="box" x="205" y="276" width="160" height="84" rx="6"/>
    <text class="h" x="285" y="310" text-anchor="middle">Poller</text>
    <text class="s" x="285" y="330" text-anchor="middle">follows each payout to</text>
    <text class="s" x="285" y="345" text-anchor="middle">PAID or RETURNED</text>
  </g>
  <g class="code">
    <rect class="box" x="20" y="276" width="160" height="84" rx="6"/>
    <text class="h" x="100" y="310" text-anchor="middle">Verifier</text>
    <text class="s" x="100" y="330" text-anchor="middle">no model, signs one</text>
    <text class="s" x="100" y="345" text-anchor="middle">certificate per employer</text>
  </g>
  <path class="arrow" d="M758,318 H737" marker-end="url(#a)"/>
  <path class="arrow" d="M573,318 H552" marker-end="url(#a)"/>
  <path class="arrow" d="M388,318 H367" marker-end="url(#a)"/>
  <path class="arrow" d="M203,318 H182" marker-end="url(#a)"/>

  <!-- ledger -->
  <path class="tick" d="M100,360 V440 M285,360 V440 M470,360 V440 M655,360 V440 M840,360 V440"/>
  <rect class="led" x="20" y="440" width="900" height="64" rx="6"/>
  <text class="h" x="470" y="468" text-anchor="middle">Append-only ledger, hash-chained</text>
  <text class="s" x="470" y="488" text-anchor="middle">every step writes here, and its head goes into each transfer's Airwallex metadata, so a rewritten ledger no longer matches the bank</text>

  <text class="s" x="20" y="536">Dark boxes are deterministic code. A refusal at either gate stops the run and moves nothing. Live version: the Try it tab on the demo site.</text>

  <!-- one run travelling the whole path -->
  <circle class="pkt pulse" r="7">
    <animateMotion dur="13s" repeatCount="indefinite" path="M100,98 H840 V318 H100"/>
  </circle>
</svg>
