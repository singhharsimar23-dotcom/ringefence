[project]
name = "ringfence"
version = "0.1.0"
description = "Multi-employer payroll executor with provable fund segregation (Airwallex Kit 06)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sse-starlette>=3",
  "pydantic>=2.13",
  "anthropic>=2.4,<3",
  "cryptography>=45",
  "tzdata",
  "mcp>=2",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ringfence"]

[tool.ruff]
line-length = 110
extend-exclude = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the Airwallex sandbox", "live_llm: hits the Anthropic API"]

[tool.ruff.lint]
ignore = ["C408"]
