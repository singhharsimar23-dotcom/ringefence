<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add an approver passkey · Ringfence</title>
<style>
@font-face{font-family:"Inter";src:url(/static/fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:dark}
body{margin:0;background:#000;color:#fff;font:15px/1.5 "Inter",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:64px 24px;display:grid;gap:16px}
h1{margin:0;font-size:26px;font-weight:640;letter-spacing:-.03em}
input{font:inherit;height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#0a0a0a;color:#fff}
button{font:inherit;font-weight:600;height:46px;border-radius:999px;border:0;background:#fff;color:#000;cursor:pointer}
#out{color:#a3a3a3;min-height:21px}
</style>
</head>
<body>
<main>
  <h1>Add an approver passkey</h1>
  <p style="color:#a3a3a3">One time, by the server's owner. Afterwards, payroll runs that an agent starts can only be approved with this passkey (Windows Hello, Touch ID or a phone).</p>
  <input id="key" type="password" placeholder="Enrolment key" autocomplete="off">
  <button id="go">Create passkey</button>
  <div id="out" role="status"></div>
</main>
<script>
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
document.getElementById("go").onclick = async () => {
  const out = document.getElementById("out");
  out.textContent = "";
  try {
    const c = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: "Ringfence", id: location.hostname },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "payroll-approver", displayName: "Payroll approver" },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { userVerification: "required", residentKey: "preferred" }, timeout: 60000, attestation: "none" } });
    const r = await fetch("/passkey", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({
      key: document.getElementById("key").value, id: c.id, spki: b64u(c.response.getPublicKey()), alg: c.response.getPublicKeyAlgorithm() }) });
    const j = await r.json().catch(() => ({}));
    out.textContent = r.ok ? `Passkey added for ${j.rp_id}.` : (j.detail || "Not added.");
  } catch (e) {
    out.textContent = "The passkey prompt was closed. Nothing was added.";
  }
};
</script>
</body>
</html>
