<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ringfence</title>
<link rel="preload" href="/static/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/play.css">
</head>
<body>
<header class="top">
  <span class="brand">Ringfence</span>
  <span class="live" id="live"></span>
  <nav class="tabs" aria-label="Pages">
    <a href="#/" id="tab-try">Try it</a>
    <a href="#/demo" id="tab-pay">Three employers</a>
    <a href="#/rules" id="tab-rules">Rules</a>
    <a href="#/proof" id="tab-proof">Proof</a>
  </nav>
  <div class="tools">
    <span class="agent" id="agent"></span>
    <button id="act-btn" data-act="drawer" aria-expanded="false" aria-controls="activity"></button>
    <div class="menu" id="menu-who">
      <button data-act="menu" data-m="who" aria-haspopup="true" aria-expanded="false" aria-label="Acting as" id="who-btn"></button>
      <div class="pop" id="pop-who" role="menu" hidden></div>
    </div>
    <div class="menu" id="menu-more">
      <button class="icon" data-act="menu" data-m="more" aria-haspopup="true" aria-expanded="false" aria-label="More" title="More">
        <svg class="ico" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="currentColor"><circle cx="4.500" cy="10" r="1.500"/><circle cx="10" cy="10" r="1.500"/><circle cx="15.500" cy="10" r="1.500"/></svg>
      </button>
      <div class="pop" id="pop-more" role="menu" hidden>
        <button role="menuitem" data-act="startover" id="m-startover"></button>
        <button role="menuitem" data-act="presenter" id="m-presenter"></button>
        <button role="menuitem" data-act="details" id="m-details" aria-pressed="false"></button>
      </div>
    </div>
    <button id="kill" class="danger" data-act="kill"></button>
  </div>
</header>
<div id="pubbar" class="bar quiet" hidden></div>
<div id="killbar" class="bar red" hidden></div>
<div id="warnbar" class="bar amber" hidden></div>
<div id="errbar" class="bar red" hidden></div>

<main>
<section id="view-try" hidden></section>
<section id="view-pay" hidden>
  <div class="problem" id="problem"></div>
  <div class="shell has-activity" id="shell">
    <div class="content">
      <div class="intro" id="intro" hidden></div>
      <div class="rail-row">
        <ol class="rail" id="rail" aria-label="Progress"></ol>
        <div class="next" id="next"></div>
      </div>
      <div class="callout" id="naive" hidden></div>
      <div class="lanes" id="lanes"></div>
      <section class="chain" id="chain" hidden aria-labelledby="chain-title"></section>
      <section class="break" aria-labelledby="brk">
        <div><h2 id="brk"></h2><p class="muted" id="brk-sub"></p></div>
        <div class="cards" id="cards"></div>
        <h3 id="ev-title"></h3>
        <div class="cards" id="events"></div>
      </section>
    </div>
    <aside class="activity" id="activity" aria-label="Activity">
      <div class="head"><h2 id="act-title"></h2><span class="chip" id="tlcount"></span></div>
      <div class="chips" id="chips" role="group" aria-label="Filter"></div>
      <ol id="tl" aria-live="polite"></ol>
    </aside>
  </div>
</section>
<section id="view-rules" hidden></section>
<section id="view-proof" hidden></section>
</main>

<dialog id="dlg-approve" aria-labelledby="ap-title"></dialog>
<dialog id="dlg-rows" aria-labelledby="rows-title"></dialog>
<dialog id="dlg-ask" aria-labelledby="ask-title"></dialog>
<dialog id="dlg-keys" aria-labelledby="keys-title"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="caption"><span class="chip" id="cap-n"></span><span id="cap-t"></span></div>
<div id="certprint" class="certprint"></div>

<script src="/static/copy.js"></script>
<script src="/static/play.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
