name: mutation
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - name: Mutate gate.py, mandate.py and money.py
        run: uv run python scripts/mutate.py --workers 4 --out mutation.json --min-score 100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation
          path: mutation.json
