name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and attach its files
      id-token: write # sign the attestation with this workflow's OIDC identity
      attestations: write # store the attestation on this repository
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag name
        run: printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - name: Lint and tests must pass for the tagged commit
        run: make check
      - name: Build the sdist and wheel
        run: uv build
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" '/^## \[/{p=index($0,"["v"]")>0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG.md section for $v"; exit 1; }
          {
            echo
            echo "Files: source distribution and wheel, with SHA256SUMS."
            echo 'Verify a download: `gh attestation verify <file> --repo '"$GITHUB_REPOSITORY"'`'
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --verify-tag --title "Ringfence $TAG" --notes-file notes.md
